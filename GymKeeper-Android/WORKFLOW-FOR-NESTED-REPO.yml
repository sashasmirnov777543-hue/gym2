# Скопируйте этот файл в КОРЕНЬ репозитория: .github/workflows/build-apk.yml
name: Build GymKeeper Offline 2.0
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymKeeper-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app/src/main/assets/app.js && node --check app/src/main/assets/data-v2.js && node --check app/src/main/assets/training-v2.js && node --check app/src/main/assets/analytics-v2.js
      - name: Unit tests
        run: node --test tests/*.test.cjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GymKeeper-offline-2.0-android13
          path: GymKeeper-Android/app/build/outputs/apk/debug/app-debug.apk
